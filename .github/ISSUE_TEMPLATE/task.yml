name: 작업
description: 텍스처 매핑 조사, 자료 준비, 구현, 테스트 및 문서 작업을 등록합니다.
title: "[작업] "
labels: ["작업"]
body:
  - type: markdown
    attributes:
      value: |
        카드 PNG 한 장을 캐릭터에 입힐 텍스처 한 장으로 변환하는 과제입니다.
        기준 문서: `Document/텍스처_매핑_인턴_인수인계.md`
        스캔 앱·공유폴더·OSC·캐릭터 스폰 및 이동·모델링·리깅·애니메이션·원근 보정은 범위 밖입니다.
        결정이 필요한 작업에는 `결정필요`, 오류 수정에는 `버그` 라벨을 추가해 주세요.
  - type: textarea
    id: objective
    attributes:
      label: 무엇을, 왜 하나요?
      description: 해결할 문제와 이번 작업의 목표를 작성해 주세요.
      placeholder: 카드 테두리가 캐릭터에 나타나지 않도록 그림 영역을 잘라내는 기준을 정합니다.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 진행 단계
      options:
        - 환경 세팅 및 카드·UV 구조 파악
        - 자료 준비 및 손 작업 기준 만들기
        - 논문 조사 및 후보 방식 비교
        - 2D 실험 및 매핑 방식 결정
        - UE 함수 및 데이터 에셋 구현
        - 데모 레벨 및 샘플 검증
        - 이음새·성능 개선
        - 문서화 및 통합 안내
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 내용 및 산출물
      description: 수행할 일과 제출할 파일·화면·문서를 구체적으로 적어 주세요.
      placeholder: |
        - [ ] 보정된 카드 PNG 5장의 그림 영역을 잘라냅니다.
        - [ ] 원본과 결과 비교 이미지를 docs/images/에 정리합니다.
        - [ ] 실험 결과를 docs/RESEARCH.md에 기록합니다.
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: 입력 자료 및 관련 이슈
      description: 해당하는 항목만 작성하고, 아직 없는 자료는 준비가 필요하다고 표시해 주세요.
      placeholder: |
        - 카드 PNG 경로 (warped_*.png):
        - 템플릿 번호 (1~24):
        - 캐릭터 메시 / UV / 조회표 / 데이터 에셋 경로:
        - 선행 작업 및 관련 이슈:
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: |
        이번 작업에 해당하는 조건을 체크리스트로 작성해 주세요.
        최종 품질 기준은 앞면·뒷면 그림이 각각 해당 면에 매핑되고 왜곡 없음, 옆·뒤·안쪽 빈 영역 또는 검은 부분 없음,
        옆구리 이음새가 눈에 띄지 않음, 카드 여백·속성 표시·테두리 제외, 카드당 처리 시간 1초 이하입니다.
        출력 크기와 윤곽선 유지/제거 정책은 미정이므로 결정이 필요한 경우 아래에 적어 주세요.
        UE 구현은 BlueprintCallable 함수 하나, 템플릿 번호별 데이터 에셋,
        TextureParameterName에 연결할 출력 텍스처 한 장, 다른 프로젝트로 옮길 수 있는 코드 구성을 확인합니다.
      placeholder: |
        - [ ] 샘플 카드 5장에서 여백·속성 표시·테두리가 제거됩니다.
        - [ ] 캐릭터 그림 영역은 잘리지 않습니다.
        - [ ] 비교 이미지와 적용한 좌표 기준이 문서에 기록됩니다.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 어떻게 확인하나요?
      description: 재현 가능한 확인 절차와 증거를 적어 주세요. 최종 검증은 샘플 10장 전수 캡처와 처리 시간 표가 필요합니다.
      placeholder: |
        - 사용 샘플 및 실행 환경:
        - 실행 명령 또는 데모 레벨 조작 순서:
        - 정면·옆면·뒷면 확인 방법:
        - 처리 시간 측정 방법 (성능 관련 작업):
        - 결과 캡처 / 확인표 경로:
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: 결정 또는 지원이 필요한 사항
      description: 선택지, 필요한 자료, 담당자 확인 사항을 적어 주세요. 확정된 결정과 이유는 docs/DECISIONS.md에 날짜와 함께 남깁니다.
      placeholder: 출력 텍스처 크기를 결정해야 합니다. 후보 크기별 품질과 처리 시간을 비교한 뒤 담당자 확인을 받습니다.
  - type: markdown
    attributes:
      value: |
        구현 브랜치는 `feature/<이슈번호>-<짧은설명>`으로 만들고 PR에 변경 내용과 확인 방법을 두 줄 이상 작성합니다.
        서로 리뷰한 뒤 담당자가 병합합니다. 실험 캡처는 `docs/images/`에 작게 저장해 주세요.
